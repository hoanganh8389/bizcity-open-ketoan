# [2026-10-30 12:10 PM Johnny Chu - Chu Hoàng Anh] ADR-0007 — chuẩn hoá mã lỗi, quan sát, bộ giám sát, cài nhanh, kiến trúc, đóng góp.
# =============================================================================
# Nguồn dữ liệu Grafana (nạp tự động khi khởi động). uid cố định để bảng điều khiển tham chiếu.
# =============================================================================
apiVersion: 1

deleteDatasources: []

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST
      manageAlerts: false
      prometheusType: Prometheus
      prometheusVersion: 2.53.4

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      # Bấm vào traceId trong một dòng nhật ký → mở trace ở Tempo (ADR-0010); reqId → mọi dòng cùng yêu cầu.
      derivedFields:
        - name: traceId
          matcherRegex: '"traceId":"([0-9a-f]{32})"'
          datasourceUid: tempo
          url: '$${__value.raw}'
          urlDisplayLabel: "Mở trace (Tempo)"
        - name: reqId
          matcherRegex: '"reqId":"([^"]+)"'
          datasourceUid: loki
          url: '{service="api"} |= `${__value.raw}`'
          urlDisplayLabel: "Xem cùng reqId"

  # [2026-11-01 04:13 PM Johnny Chu - Chu Hoàng Anh] ADR-0010 — OpenTelemetry từ lõi (PHASE-018 W5): span ở khớp nối Platform + cổng Kernel, lọc thuộc tính, traceparent qua outbox
  # Trace (lớp 5 của sáu lớp bảo đảm): từ span → nhật ký cùng traceId (Loki), → số đo của route (Prometheus).
  # Tìm theo module: TraceQL { span.bizcity.module = "quy" && status = error }.
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{service="api"} |= "$${__trace.traceId}"'
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: '-10m'
        spanEndTimeShift: '10m'
        tags:
          - { key: http.route, value: route }
        queries:
          - name: Độ trễ p95 của route
            query: 'histogram_quantile(0.95, sum by (le) (rate(bizcity_http_request_duration_seconds_bucket{$$__tags}[5m])))'
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false
      lokiSearch:
        datasourceUid: loki

  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    editable: false
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
