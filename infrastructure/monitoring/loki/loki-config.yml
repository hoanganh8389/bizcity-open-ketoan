# =============================================================================
# Loki 3.x — chế độ một tiến trình (single binary), lưu trên đĩa (ổ loki-data), giữ nhật ký 30 ngày.
# Đủ cho một máy chủ; khi cần mở rộng nhiều máy hãy chuyển sang lưu trữ đối tượng (S3/MinIO).
# =============================================================================

auth_enabled: false   # một đơn vị dùng (Loki "tenant" khác với tenant nghiệp vụ của Bizcity)

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  # Bắt buộc để xoá nhật ký quá hạn (retention_period bên dưới).
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

limits_config:
  # Giữ 30 ngày. Nhật ký kiểm toán nghiệp vụ nằm trong CSDL (bảng audit), không phụ thuộc Loki.
  retention_period: 720h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # Chặn bùng số luồng nếu ai đó lỡ thêm nhãn số lượng lớn ở Promtail.
  max_global_streams_per_user: 10000
  max_label_names_per_series: 15
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  max_query_lookback: 720h
  allow_structured_metadata: true
  volume_enabled: true

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

ruler:
  alertmanager_url: http://alertmanager:9093

analytics:
  reporting_enabled: false
