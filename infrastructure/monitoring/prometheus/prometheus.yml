# [2026-10-30 12:10 PM Johnny Chu - Chu Hoàng Anh] ADR-0007 — chuẩn hoá mã lỗi, quan sát, bộ giám sát, cài nhanh, kiến trúc, đóng góp.
# =============================================================================
# Prometheus — cấu hình thu chỉ số cho Bizcity / open-ketoan.
# Thư mục này được gắn vào /etc/prometheus (chỉ đọc) — xem docker-compose.monitoring.yml.
# Nạp lại không cần khởi động lại:  curl -X POST http://127.0.0.1:9090/-/reload
# =============================================================================

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    # Đổi khi có nhiều bản cài cùng gửi về một nơi (vd. ketoan-prod, ketoan-test).
    environment: ketoan

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # --- API Bizcity (Fastify) --------------------------------------------------
  - job_name: api
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["api:4100"]
        labels:
          service: api
    # Khi API đặt biến môi trường METRICS_TOKEN, /metrics đòi header
    # "Authorization: Bearer <token>". Khi đó:
    #   1. Ghi token (một dòng, không xuống dòng thừa) vào tệp
    #      infrastructure/monitoring/prometheus/secrets/metrics_token
    #      (thư mục secrets/ đã có trong .gitignore — KHÔNG commit token).
    #   2. Bỏ dấu # ở ba dòng dưới đây.
    #   3. curl -X POST http://127.0.0.1:9090/-/reload
    # Prometheus không đọc biến môi trường trong tệp này, nên dùng credentials_file thay vì ghi thẳng token.
    # authorization:
    #   type: Bearer
    #   credentials_file: /etc/prometheus/secrets/metrics_token

  # --- PostgreSQL (qua postgres-exporter) -------------------------------------
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: db

  # --- Máy chủ (CPU, RAM, đĩa) ------------------------------------------------
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # --- Container (RAM / CPU từng dịch vụ) -------------------------------------
  - job_name: cadvisor
    scrape_interval: 30s
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # Bỏ chuỗi của cgroup gốc / hệ thống (không có tên container) — giảm số chuỗi lưu trữ.
      - source_labels: [name]
        regex: ""
        action: drop

  # --- Bản thân bộ giám sát ---------------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
