# [2026-10-30 12:10 PM Johnny Chu - Chu Hoàng Anh] ADR-0007 — chuẩn hoá mã lỗi, quan sát, bộ giám sát, cài nhanh, kiến trúc, đóng góp.
# =============================================================================
# Bộ giám sát TUỲ CHỌN cho Bizcity / open-ketoan — Prometheus + Alertmanager + Grafana + Loki + Tempo (OTel Collector).
#
# Đây là tệp GHÉP (override) với docker-compose.yml ở gốc kho. Chạy TỪ GỐC KHO:
#
#   docker compose -f docker-compose.yml -f infrastructure/monitoring/docker-compose.monitoring.yml up -d
#   docker compose -f docker-compose.yml -f infrastructure/monitoring/docker-compose.monitoring.yml down
#
# Vì ghép cùng dự án `ketoan`, các dịch vụ dưới đây nằm chung mạng mặc định với `api`, `db`
# và gọi được http://api:4100/metrics, db:5432.
#
# Đường dẫn gắn ổ (volume) tương đối được tính theo thư mục của tệp -f ĐẦU TIÊN (gốc kho),
# nên mọi đường dẫn đều bắt đầu bằng ./infrastructure/monitoring/...
#
# Cổng chỉ mở trên 127.0.0.1 — giám sát KHÔNG công khai ra Internet. Truy cập từ xa: đường hầm SSH
# (ssh -L 3000:127.0.0.1:3000 may-chu) hoặc reverse proxy có xác thực.
#
#   Grafana       http://127.0.0.1:3000   (admin / GRAFANA_ADMIN_PASSWORD)
#   Prometheus    http://127.0.0.1:9090
#   Alertmanager  http://127.0.0.1:9093
#
# Xem infrastructure/monitoring/README.md.
# =============================================================================

services:
  # [2026-11-01 04:13 PM Johnny Chu - Chu Hoàng Anh] ADR-0010 — OpenTelemetry từ lõi (PHASE-018 W5): span ở khớp nối Platform + cổng Kernel, lọc thuộc tính, traceparent qua outbox
  # --- API gửi trace cho Collector khi bật bộ giám sát (ADR-0010) --------------
  # Không bật bộ giám sát: API vẫn có traceId trong log / phản hồi lỗi / bằng chứng nhưng không gửi trace đi đâu.
  api:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      # [2026-11-01 10:40 PM Johnny Chu - Chu Hoàng Anh] PHASE-019 — W2: Bàn điều tra đọc Tempo / Loki qua mạng nội bộ (trình duyệt không gọi thẳng)
      DEVTOOLS_TEMPO_URL: ${DEVTOOLS_TEMPO_URL:-http://tempo:3200}
      DEVTOOLS_LOKI_URL: ${DEVTOOLS_LOKI_URL:-http://loki:3100}
      DEVTOOLS_PROMETHEUS_URL: ${DEVTOOLS_PROMETHEUS_URL:-http://prometheus:9090}
      DEVTOOLS_ALERTMANAGER_URL: ${DEVTOOLS_ALERTMANAGER_URL:-http://alertmanager:9093}
      DEVTOOLS_GRAFANA_URL: ${DEVTOOLS_GRAFANA_URL:-http://127.0.0.1:3000}
      DEVTOOLS_OPS: ${DEVTOOLS_OPS:-}

  # --- Thu thập & lưu chỉ số --------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.4   # dòng LTS 2.53
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Giữ chỉ số 15 ngày hoặc tối đa 10 GB, cái nào tới trước.
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --storage.tsdb.retention.size=10GB
      # Cho phép nạp lại cấu hình: curl -X POST http://127.0.0.1:9090/-/reload
      - --web.enable-lifecycle
      - --web.external-url=http://127.0.0.1:9090
    volumes:
      # Cả thư mục prometheus/ (prometheus.yml, alerts.yml, secrets/metrics_token nếu có).
      - ./infrastructure/monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - alertmanager
    deploy:
      resources:
        limits:
          memory: 1g

  # --- Định tuyến cảnh báo ----------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=http://127.0.0.1:9093
    volumes:
      - ./infrastructure/monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    deploy:
      resources:
        limits:
          memory: 128m

  # --- Bảng điều khiển ----------------------------------------------------------
  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # BẮT BUỘC: đặt GRAFANA_ADMIN_PASSWORD trong .env ở gốc kho — thiếu thì docker compose dừng và báo (cùng kiểu JWT_SECRET).
      # Lưu ý: mật khẩu chỉ áp dụng lần khởi tạo đầu (ổ grafana-data trống); đổi sau đó dùng
      #   docker compose ... exec grafana grafana cli admin reset-admin-password <mật-khẩu-mới>
      # [2026-11-01 12:04 AM Johnny Chu - Chu Hoàng Anh] PHASE-018 — bỏ mật khẩu dự phòng "doi-mat-khau-ngay" (P0 khảo sát W0): biến bắt buộc
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Đặt GRAFANA_ADMIN_PASSWORD trong .env ở gốc kho (infrastructure/monitoring/README.md §4)}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://127.0.0.1:3000}
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: Asia/Ho_Chi_Minh
      GF_DEFAULT_LOCALE: vi-VN
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    deploy:
      resources:
        limits:
          memory: 512m

  # --- Lưu nhật ký ------------------------------------------------------------
  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./infrastructure/monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    # Không mở cổng ra máy chủ: chỉ Grafana và Promtail (cùng mạng) gọi tới http://loki:3100.
    deploy:
      resources:
        limits:
          memory: 1g

  # --- Gom nhật ký container → Loki ------------------------------------------
  promtail:
    image: grafana/promtail:3.3.2
    restart: unless-stopped
    command:
      - -config.file=/etc/promtail/promtail-config.yml
      # [2026-11-01 01:14 AM Johnny Chu - Chu Hoàng Anh] PHASE-018 — thế biến môi trường vào cấu hình (LOKI_LABELDROP, S018-13b)
      - -config.expand-env=true
    environment:
      # Bản cài hàng trăm+ đơn vị: LOKI_LABELDROP=tenant — bỏ nhãn tenant để Loki không phình luồng (README §9).
      LOKI_LABELDROP: ${LOKI_LABELDROP:-}
    volumes:
      - ./infrastructure/monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Đọc danh sách container và nhật ký qua Docker API (chỉ đọc).
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/var/lib/promtail
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 256m

  # --- Truy vết: API → OTel Collector → Tempo (ADR-0010) -----------------------
  # Collector lấy mẫu ĐUÔI: giữ mọi trace có lỗi hoặc chậm > 1 s, cộng TRACE_SAMPLE_PERCENT% còn lại (mặc định 10).
  # Không mở cổng ra máy chủ: chỉ API (cùng mạng) gửi vào http://otel-collector:4318.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yml"]
    environment:
      TRACE_SAMPLE_PERCENT: ${TRACE_SAMPLE_PERCENT:-10}
    volumes:
      - ./infrastructure/monitoring/otel-collector/config.yml:/etc/otelcol/config.yml:ro
    depends_on:
      - tempo
    deploy:
      resources:
        limits:
          memory: 384m

  # Ổ tempo-data tạo mới thuộc root; Tempo chạy bằng người dùng 10001 → chỉnh quyền một lần trước khi chạy.
  tempo-init:
    image: busybox:1.36.1
    user: root
    command: ["chown", "-R", "10001:10001", "/var/tempo"]
    volumes:
      - tempo-data:/var/tempo
    restart: "no"

  tempo:
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./infrastructure/monitoring/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    # Không mở cổng ra máy chủ: Grafana đọc http://tempo:3200, Collector gửi tempo:4317.
    depends_on:
      tempo-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1g

  # --- Chỉ số PostgreSQL ------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: db:5432/ketoan?sslmode=disable
      # Vai trò chỉ đọc thống kê ketoan_monitor (pg_monitor, không đọc bảng nghiệp vụ): đặt PG_EXPORTER_USER=ketoan_monitor +
      # PG_EXPORTER_PASSWORD (≥ 16 ký tự) trong .env — job db-migrate tự tạo vai trò (db/setup.ts). scripts/cai-nhanh.sh --giam-sat
      # tự sinh. Không đặt: dùng vai trò sở hữu (chỉ cho máy thử).
      DATA_SOURCE_USER: ${PG_EXPORTER_USER:-ketoan}
      DATA_SOURCE_PASS: ${PG_EXPORTER_PASSWORD:-${DB_PASSWORD:-ketoan}}
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m

  # --- Chỉ số máy chủ (CPU, RAM, đĩa) -----------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($|/)
    pid: host
    volumes:
      # Docker Desktop (Windows/macOS): "máy chủ" là máy ảo của Docker, không phải ổ C:.
      - /:/host:ro,rslave
    deploy:
      resources:
        limits:
          memory: 64m

  # --- Chỉ số container (RAM, CPU từng dịch vụ) ------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      # Chỉ giữ hai nhãn compose để tránh bùng số chuỗi (mỗi nhãn container là một nhãn chỉ số).
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
      - --disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl,process
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
  promtail-positions:
  tempo-data:
