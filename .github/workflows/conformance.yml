# [2026-10-29 10:24 PM Johnny Chu - Chu Hoàng Anh] INIT — khởi tạo Bizcity Core Framework: sổ cái chỉ thêm, cửa nạp sự việc, CANON, hợp đồng, bộ kiểm chuẩn.
# [2026-11-01 01:14 AM Johnny Chu - Chu Hoàng Anh] PHASE-018 — job monitoring: promtool check / test rules, check config, amtool check-config (S018-14b).
# Bộ kiểm chuẩn Bizcity Core — tests/conformance/README.md · docs/adr/ADR-0006
# Hai lane: selfcheck (tĩnh, không cần npm ci) và diagnostics (PostgreSQL thật, chỉ đọc, sau khi chạy test).
# Thêm job monitoring: cấu hình bộ giám sát (infrastructure/monitoring) — luật cảnh báo bắn / hết bắn đúng, cấu hình nạp được.
name: conformance

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selfcheck:
    name: Bộ kiểm chuẩn (selfcheck + tự kiểm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Bộ kiểm tự kiểm trước: bộ kiểm sai thì kết quả kiểm repo không đáng tin.
      - run: node tests/conformance/selfcheck.mjs --self-test
      # --strict: nợ đã hết phải dọn khỏi baseline (bánh cóc chỉ chặt thêm).
      - run: node tests/conformance/selfcheck.mjs --lane selfcheck --strict
      - name: Bảng điểm vào trang tóm tắt
        if: always()
        run: cat tests/conformance/output/runs/*/SCOREBOARD.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-selfcheck
          path: tests/conformance/output/
          retention-days: 30

  monitoring:
    name: Bộ giám sát (promtool, amtool)
    runs-on: ubuntu-latest
    env:
      M: ${{ github.workspace }}/infrastructure/monitoring
      PROM: prom/prometheus:v2.53.4
      AM: prom/alertmanager:v0.27.0
    steps:
      - uses: actions/checkout@v4
      # Cú pháp + nạp cấu hình Prometheus (kéo theo alerts.yml)
      - run: docker run --rm -v "$M/prometheus:/etc/prometheus:ro" --entrypoint promtool "$PROM" check config /etc/prometheus/prometheus.yml
      # Luật cảnh báo bắn / không bắn / hết bắn đúng (alerts.test.yml, S018-14)
      - run: docker run --rm -v "$M/prometheus:/etc/prometheus:ro" --entrypoint promtool "$PROM" test rules /etc/prometheus/alerts.test.yml
      - run: docker run --rm -v "$M/alertmanager:/etc/alertmanager:ro" --entrypoint amtool "$AM" check-config /etc/alertmanager/alertmanager.yml

  diagnostics:
    name: Bộ kiểm chuẩn (diagnostics trên PostgreSQL 16)
    runs-on: ubuntu-latest
    needs: [selfcheck]
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ketoan
          POSTGRES_USER: ketoan
          POSTGRES_PASSWORD: ketoan
          TZ: Asia/Ho_Chi_Minh
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ketoan -d ketoan"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://ketoan:ketoan@localhost:5432/ketoan
      JWT_SECRET: ci-only-secret-not-for-production-0123456789
      ENABLED_MODULES: "*"
      TZ: Asia/Ho_Chi_Minh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @ketoan/contracts
      - run: npm run db:seed
      # Chạy bộ test để CSDL có bút toán thật, rồi kiểm toàn vẹn trên chính dữ liệu đó (thay tạm R-QG-5 tới khi có test-kit).
      - run: npm test
      - run: node tests/conformance/selfcheck.mjs --lane diagnostics
      - name: Bảng điểm vào trang tóm tắt
        if: always()
        run: cat tests/conformance/output/runs/*/SCOREBOARD.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-diagnostics
          path: tests/conformance/output/
          retention-days: 30
