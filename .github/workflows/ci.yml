# CI BizCity Ledger Framework — xem docs/ops/CI-CD.md
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Kiểm chuẩn (grep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/kiem-chuan.sh

  typecheck:
    name: Kiểm kiểu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # @ketoan/contracts, @bizcity/mua-hang-domain trỏ vào dist/ — build trước để api, web thấy kiểu
      - run: npm run build -w @ketoan/contracts && npm run build -w @bizcity/mua-hang-domain
      - run: npm run typecheck
      - name: Lệnh kế toán trên bản dựng thật (event check, explain)
        run: npm run build -w @bizcity/platform && npm run build -w @bizcity/kernel && node --test packages/cli/test/accounting-cli.test.mjs packages/cli/test/module-accounting.test.mjs packages/cli/test/saving-model.test.mjs

  test:
    name: Test trên PostgreSQL 16
    runs-on: ubuntu-latest
    needs: [guard]
    services:
      db:
        image: postgres:16-alpine
        env:
          # [2026-11-02 04:00 PM Johnny Chu - Chu Hoàng Anh] FIX — test chạy trên CSDL tên có "test" (vitest.config.ts chặn tên khác)
          POSTGRES_DB: ketoan_test
          POSTGRES_USER: ketoan
          POSTGRES_PASSWORD: ketoan
          TZ: Asia/Ho_Chi_Minh
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ketoan -d ketoan_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://ketoan:ketoan@localhost:5432/ketoan_test
      JWT_SECRET: ci-only-secret-not-for-production-0123456789
      ENABLED_MODULES: "*"
      TZ: Asia/Ho_Chi_Minh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @ketoan/contracts && npm run build -w @bizcity/mua-hang-domain
      - run: npm run db:seed
      - name: vitest (+ báo cáo JSON làm bằng chứng)
        env:
          DB_SET_ROLE: ketoan_app
        run: npm test -- --reporter=default --reporter=json --outputFile=test-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: apps/api/test-report.json
          retention-days: 30

  # R-DB-15: migration của PR phải chạy được trên CSDL CÓ DỮ LIỆU của bản phát hành trước (job "test" đã chạy trên CSDL sạch).
  # Mốc = tag v* mới nhất. Chưa có bản phát hành nào thì bỏ qua (ghi rõ trong log) — mọi commit trước ccfc341 không cài sạch được.
  migrate-upgrade:
    name: Migration nâng cấp từ bản phát hành trước
    runs-on: ubuntu-latest
    needs: [guard]
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ketoan
          POSTGRES_USER: ketoan
          POSTGRES_PASSWORD: ketoan
          TZ: Asia/Ho_Chi_Minh
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ketoan -d ketoan"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TZ: Asia/Ho_Chi_Minh
      DB_URL_BASE: postgres://ketoan:ketoan@localhost:5432
      PSQL: psql postgres://ketoan:ketoan@localhost:5432/ketoan_nang_cap
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tìm bản phát hành trước
        id: base
        run: echo "ref=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
      - name: Chưa có bản phát hành — bỏ qua
        if: steps.base.outputs.ref == ''
        run: |
          echo "::notice::Chưa có tag v* nào — kiểm nâng cấp bắt đầu chạy từ bản phát hành đầu tiên (RELEASE.md)."
      - if: steps.base.outputs.ref != ''
        run: npm ci && npm run build -w @ketoan/contracts && npm run build -w @bizcity/mua-hang-domain
      - name: Nâng cấp ${{ steps.base.outputs.ref }} → PR, kiểm toàn vẹn
        if: steps.base.outputs.ref != ''
        run: bash scripts/kiem-nang-cap.sh "${{ steps.base.outputs.ref }}"
