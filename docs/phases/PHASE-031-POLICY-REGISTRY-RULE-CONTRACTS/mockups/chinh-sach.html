.hbar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--bar);border-radius:0 4px 4px 0}
.hbar .cap{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mod = { 'ban-hang':'Bán hàng','mua-hang':'Mua hàng','quy':'Quỹ','nhan-su':'Nhân sự' };
let st = { pol:0, at:'2026-11-15', ptab:'ver', q:0, tdir:'back' };
try { const s = JSON.parse(localStorage.getItem('p031') || '{}'); if (s.tab) st.tab = s.tab; } catch (e) {}

function effective(p, at){ return p.versions.find(v => v.from <= at && (!v.to || at <= v.to)); }
function dayPos(d){ const a = Date.parse('2026-10-01'), b = Date.parse('2026-12-31'); return Math.max(0, Math.min(100, (Date.parse(d) - a) / (b - a) * 100)); }

function renderPol(){
  const p = POLICIES[st.pol], ev = effective(p, st.at);
  const list = POLICIES.map((x, i) => {
    const e = effective(x, st.at);
    const tag = x.draft ? '<span class="tag none">nháp</span>' : e ? `<span class="tag ok">bản ${e.v}</span>` : '<span class="tag none">không hiệu lực</span>';
    return `<button aria-pressed="${i === st.pol}" data-pol="${i}"><div class="t"><b class="mono">${esc(x.key)}</b>${tag}</div><small>${esc(x.name)} · ${mod[x.module]}</small></button>`;
  }).join('');
  const rows = p.versions.map(v => {
    const l = dayPos(v.from), r = v.to ? dayPos(v.to) : 100;
    return `<div class="row"><div class="seg ${ev && ev.v === v.v ? 'on' : ''}" style="left:${l}%;width:${Math.max(4, r - l)}%" data-tip="Bản ${v.v}: ${v.from} → ${v.to || 'chưa đóng'} · băm ${v.hash}">bản ${v.v}</div></div>`;
  }).join('');
  const body = {
    ver: `<div class="tl"><div class="axis"><span>01/10</span><span>01/11</span><span>01/12</span><span>31/12</span></div>${rows}<div class="at" style="left:${dayPos(st.at)}%" data-l="${st.at.slice(8)}/${st.at.slice(5,7)}"></div></div>

      <p class="muted" style="font-size:12.5px">Bản đã phát hành không sửa. Đổi = bản mới; bản cũ tự đóng ở ngày trước hiệu lực bản mới, không có khoảng trống.</p>`,
    rule: `<div class="grid2"><div><h3>Tham số</h3><dl class="kv">${p.params.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('')}</dl></div>
      <div><h3>Phép kiểm gắn theo</h3><ul style="margin:0;padding-left:18px">${p.checks.map(c => `<li class="mono" style="font-size:12.5px">${esc(c)}</li>`).join('')}</ul>
      <h3>Cách ghi nhận kế toán</h3><table><thead><tr><th>Kết quả</th><th>Lý do định khoản</th><th>Nghĩa</th></tr></thead><tbody>${p.treat.map(t => `<tr><td>${esc(t[0])}</td><td class="mono">${esc(t[1])}</td><td class="muted">${esc(t[2])}</td></tr>`).join('')}</tbody></table>
      <p class="muted" style="font-size:12.5px">Rule Contract chỉ chỉ lý do định khoản. Số tài khoản do chính sách định khoản của Kernel quyết tại ngày chứng từ.</p></div></div>`,
    use: p.consumers.length ? `<div class="tbl"><table><thead><tr><th>Nơi dùng</th><th>Bản đang giữ</th><th>So với bản tại ngày</th><th>Trạng thái</th></tr></thead><tbody>${p.consumers.map(([n, v, s]) => {
        const t = v == null ? '<span class="tag bad">không gửi tham chiếu</span>' : ev && v === ev.v ? '<span class="tag ok">khớp</span>' : '<span class="tag warn">bản cũ</span>';

      <tr><td class="mono">wp-pos:hn01:sale:88123</td><td>15/11</td><td>POS WP</td><td>3</td><td><span class="tag warn">⚠ POL-EVAL-001</span></td></tr>
      <tr><td class="mono">woo:web:sale:5521</td><td>16/11</td><td>Woo</td><td>2</td><td><span class="tag warn">⚠ POL-STALE-001</span></td></tr>
      <tr><td class="mono">ban-hang.order:HN01-1102</td><td>16/11</td><td>Bán hàng nội bộ</td><td>3</td><td><span class="tag ok">✓ đạt</span></td></tr></tbody></table></div>
      <p class="muted" style="font-size:12.5px">Đọc <span class="mono">bizcity_read.policy_application</span> — cùng khung nhìn với bảng theo dõi và rulepack tư vấn.</p>`
  }[st.ptab];
  $('#tab-pol').innerHTML = `
    <h2>Chính sách</h2><p class="lead">Module sở hữu nội dung; Registry giữ phong bì: khoá, bản, phạm vi, hiệu lực, băm, Rule Contract. Plugin chỉ dùng bản đã phát hành.</p>
    <div class="layout"><div class="panel"><div class="filters"><label>Xem tại ngày <input type="date" id="at" value="${st.at}"></label></div><div class="list">${list}</div></div>
    <div class="panel card">
      <div style="display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap"><div style="flex:1;min-width:220px"><h4><span class="mono">${esc(p.key)}</span> · ${esc(p.name)}</h4>
      <div class="muted" style="font-size:12.5px">${mod[p.module]} sở hữu · <span class="k">${esc(p.rc)}</span>${p.store ? ' · nội dung ở <span class="mono">setting_values</span>' : ''} · ${esc(p.scope)}${p.legal ? ' · căn cứ ' + esc(p.legal) : ''}</div></div>

}

const R = { pol: renderPol, que: renderQue, tra: renderTra, das: renderDas };
function show(tab){
  document.querySelectorAll('[role=tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  Object.keys(R).forEach(k => $('#tab-' + k).hidden = k !== tab);
  R[tab](); st.tab = tab;
  try { localStorage.setItem('p031', JSON.stringify({ tab })); } catch (e) {}
}
document.addEventListener('click', e => {
  const t = e.target.closest('button,a'); if (!t) return;
  if (t.dataset.tab) show(t.dataset.tab);
  else if (t.dataset.pol) { st.pol = +t.dataset.pol; renderPol(); }
  else if (t.dataset.ptab) { st.ptab = t.dataset.ptab; renderPol(); }
  else if (t.dataset.q) { st.q = +t.dataset.q; renderQue(); }
  else if (t.dataset.tdir) { st.tdir = t.dataset.tdir; renderTra(); }
  else if (t.dataset.goto) { e.preventDefault(); show(t.dataset.goto); }
  else if (t.dataset.tbl) { const x = document.getElementById(t.dataset.tbl); x.hidden = !x.hidden; }
  else if (t.id === 'theme') { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; }
});
document.addEventListener('change', e => { if (e.target.id === 'at') { st.at = e.target.value || st.at; renderPol(); } });
const tip = $('#tip');
document.addEventListener('mousemove', e => { const t = e.target.closest('[data-tip]'); if (!t) { tip.style.display = 'none'; return; } tip.textContent = t.dataset.tip; tip.style.display = 'block'; tip.style.left = Math.min(e.clientX + 12, innerWidth - 270) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; });
renderQue();
const h = location.hash.slice(1);
show(R[h] ? h : st.tab || 'pol');
</script>
