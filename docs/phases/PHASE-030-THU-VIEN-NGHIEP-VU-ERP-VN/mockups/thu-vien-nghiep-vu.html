*{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

.flow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;margin-bottom:14px}
.lane{background:var(--soft);border-radius:10px;padding:10px;font-size:12.5px}
.lane b{display:block;font-size:13px;margin-bottom:2px}
.lane span{color:var(--muted)}
.steps{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;align-items:stretch}

.step.ok{border-top-color:var(--ok)}.step.warn{border-top-color:var(--warn)}.step.bad{border-top-color:var(--bad)}.step.k{border-top-color:var(--k)}
.step .n{position:absolute;top:-12px;left:10px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.step h3{margin:4px 0 2px;font-size:13.5px;font-weight:650;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.step h3 code{color:var(--muted)}
.step p{margin:2px 0 6px;color:var(--muted);font-size:12.5px}
.states{display:flex;flex-wrap:wrap;gap:3px;margin:4px 0}
.states i{font-style:normal;font:11px ui-monospace,Consolas,monospace;padding:1px 6px;border-radius:5px;background:var(--soft);color:var(--ink)}
.states i.g{background:var(--ok-bg)}
.post{font:11.5px ui-monospace,Consolas,monospace;color:var(--k);word-break:break-word;margin-top:4px}
.src{font:11px ui-monospace,Consolas,monospace;color:var(--muted);word-break:break-word;margin-top:6px}
.arrow{align-self:center;color:var(--none);font-size:20px;flex:0 0 auto}
.side{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}

.card ul{margin:0;padding-left:16px;font-size:12.5px}
.card li{margin:2px 0}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px}
section[hidden]{display:none}

const STATUS = {ok:'✅ có', warn:'🟡 một phần', bad:'☐ chưa', k:'K cần Kernel'};
const tabs = document.getElementById('tabs'), main = document.getElementById('main');
function count(g){const c={ok:0,warn:0,bad:0,k:0};g.lanes.forEach(l=>l.steps.forEach(s=>c[s.status]++));return c;}
GROUPS.forEach((g,i)=>{
  const c=count(g);
  const b=document.createElement('button');b.role='tab';b.id='tab-'+g.id;b.innerHTML=`${g.title}<small>${c.ok}/${c.warn}/${c.bad+c.k}</small>`;
  b.onclick=()=>show(g.id);tabs.appendChild(b);
  const s=document.createElement('section');s.id=g.id;s.hidden=true;
  s.innerHTML=`<h2>${g.title}</h2><p class="lead">${g.sub} · <b>Đích:</b> <code>${g.target}</code> · ✅ ${c.ok} · 🟡 ${c.warn} · ☐ ${c.bad} · K ${c.k}</p>
  <div class="todo"><b>Việc cần làm</b><ul>${g.todo.map(t=>`<li><code>${t[0]}</code> ${t[1]}</li>`).join('')}</ul></div>
  ${g.lanes.map(l=>`<div class="flow"><div class="lane"><b>${l.name}</b><span>${l.note||''}</span></div><div class="steps">${l.steps.map((st,j)=>`
    <div class="step ${st.status}"><div class="n">${j+1}</div>
      <h3>${st.name} <code>${st.code}</code> <span class="tag ${st.status}">${STATUS[st.status]}</span></h3>
      <p><code>${st.doc}</code></p>
      <div class="states">${st.states.map((x,k)=>`<i class="${k===st.states.length-1?'g':''}">${x}</i>`).join('<span style="color:var(--none)">→</span>')}</div>
      <div class="post">sổ: ${st.post}</div>
      <div class="src">nguồn: ${st.src} · đích: ${st.target}</div>
    </div>${j<l.steps.length-1?'<div class="arrow">→</div>':''}`).join('')}</div></div>`).join('')}
  <div class="side"><div class="card"><h3>Đọc tiếp</h3><ul><li>Blueprint: <code>docs/phases/PHASE-030-…/5x-BP-*.md</code> (mục 1–9 từng mã)</li><li>Golden test: <code>60-GOLDEN-TESTS.md</code> mã <code>T030-${g.id.toUpperCase()}-*</code></li><li>Ma trận: <code>10-DOI-CHIEU-ERP-VN.md</code></li></ul></div>
  <div class="card"><h3>Luật không thương lượng</h3><ul><li>Không sự việc, không bút toán; đơn / báo giá / yêu cầu <b>không</b> ghi sổ</li><li>Sửa sau ghi sổ = phiên bản mới cùng docKey (đảo + ghi lại)</li><li>Không số tài khoản trong module: chỉ <code>reasonCode</code></li><li>Tham số = <code>setting_values</code> có ngày hiệu lực, có <code>legalRef</code></li></ul></div></div>`;
  main.appendChild(s);
});
function show(id){GROUPS.forEach(g=>{document.getElementById(g.id).hidden=g.id!==id;document.getElementById('tab-'+g.id).setAttribute('aria-selected',g.id===id);});history.replaceState(null,'','#'+id);}
show((location.hash||'#mh').slice(1).replace(/[^a-z]/g,'')||'mh');
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
document.getElementById('theme').onclick=()=>{const r=document.documentElement;const cur=r.getAttribute('data-theme');const dark=cur?cur==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.setAttribute('data-theme',dark?'light':'dark');};
