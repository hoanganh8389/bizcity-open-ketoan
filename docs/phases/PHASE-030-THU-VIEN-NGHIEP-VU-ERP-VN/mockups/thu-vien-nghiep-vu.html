<style>
:root{

  --accent:#0b5cad;--ok-bg:#e8f5ee;--warn-bg:#fff3e0;--bad-bg:#fdecea;--k-bg:#f1eafc;--info-bg:#e8f0fc;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1115;--panel:#171a21;--ink:#e7e9ee;--muted:#9aa1ae;--line:#272b35;--soft:#1e222b;
  --ok:#3fbf7f;--warn:#e0a03a;--bad:#ef5350;--info:#5b9cf0;--none:#6b7280;--k:#b08cf0;
  --accent:#5b9cf0;--ok-bg:#12301f;--warn-bg:#33260f;--bad-bg:#3a1717;--k-bg:#241a3a;--info-bg:#15243d;
}}
:root[data-theme="dark"]{

  --ok:#3fbf7f;--warn:#e0a03a;--bad:#ef5350;--info:#5b9cf0;--none:#6b7280;--k:#b08cf0;

*{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
code,.mono{font:12.5px ui-monospace,SFMono-Regular,Consolas,monospace}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:650}
.logo{width:28px;height:28px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.spacer{flex:1}
.btn{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font:inherit;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:3px 8px;font-size:12.5px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 16px;overflow-x:auto;background:var(--panel)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 10px;font:inherit;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tabs button small{color:var(--muted);font:11px ui-monospace,Consolas,monospace;margin-left:4px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.subtabs button{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font:inherit;font-size:13px;color:var(--muted);cursor:pointer}
.subtabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent);font-weight:600}
main{padding:16px;max-width:1400px;width:100%;min-width:0;margin:0 auto}
h2{margin:0 0 4px;font-size:18px}
h3{font-size:14.5px;margin:18px 0 8px}
.lead{color:var(--muted);margin:0 0 12px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.k{background:var(--k-bg);color:var(--k)}.tag.none{background:var(--soft);color:var(--none)}.tag.info{background:var(--info-bg);color:var(--info)}
.todo{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.note{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--info);border-radius:10px;padding:10px 14px;margin:10px 0 14px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px;margin-bottom:14px}
.grid.wide{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.card h4{margin:0 0 4px;font-size:13.5px;font-weight:650;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card p{margin:2px 0;color:var(--muted);font-size:12.5px}
.card ul{margin:4px 0 0;padding-left:16px;font-size:12.5px}
.card .k{font:11.5px ui-monospace,Consolas,monospace;color:var(--k);word-break:break-word}
a.tile{display:block;text-decoration:none;color:inherit}
a.tile:hover{border-color:var(--accent)}
.tbl{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;background:var(--soft)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
section[hidden]{display:none}
/* bản đồ luồng */
.map{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow-x:auto;margin-bottom:10px}
.map svg{display:block}
.map .lane-bg{fill:var(--soft)}
.map .lane-bg.alt{fill:var(--panel)}
.map .lane-t{fill:var(--muted);font-size:11.5px;font-weight:600}
.map .nd{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.map .nd.g-draft{stroke:var(--none)}.map .nd.g-pending{stroke:var(--warn)}.map .nd.g-approved{stroke:var(--info)}.map .nd.g-done{stroke:var(--ok)}.map .nd.g-cancelled{stroke:var(--bad)}
.map .bar.g-draft{fill:var(--none)}.map .bar.g-pending{fill:var(--warn)}.map .bar.g-approved{fill:var(--info)}.map .bar.g-done{fill:var(--ok)}.map .bar.g-cancelled{fill:var(--bad)}
.map .gate{fill:var(--warn-bg);stroke:var(--warn);stroke-width:1.2}
.map .post{fill:var(--k-bg);stroke:var(--k);stroke-width:1.2}
.map .calc{fill:var(--panel);stroke:var(--accent);stroke-width:1.2;stroke-dasharray:4 3}
.map .t1{fill:var(--ink);font-size:12px;font-weight:650}
.map .t2{fill:var(--muted);font-size:10.5px;font-family:ui-monospace,Consolas,monospace}
.map .tk{fill:var(--k);font-size:10.5px;font-family:ui-monospace,Consolas,monospace}
.map .e{fill:none;stroke:var(--none);stroke-width:1.4}
.map .e.link{stroke-dasharray:5 4;stroke:var(--accent)}
.map .el{fill:var(--muted);font-size:10px}
.map .elbg{fill:var(--panel)}
.map .ah{fill:var(--none)}.map .ah.link{fill:var(--accent)}
.mlegend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 12px}
.mlegend span{display:inline-flex;gap:5px;align-items:center}
.sw{width:14px;height:10px;border-radius:3px;display:inline-block;border:1.5px solid}
/* chuẩn chứng từ */
.life{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0 12px}
.pill{padding:4px 10px;border-radius:99px;font-size:12.5px;font-weight:600;border:1.5px solid}
.pill.draft{color:var(--none);border-color:var(--none)}.pill.pending{color:var(--warn);border-color:var(--warn)}.pill.approved{color:var(--info);border-color:var(--info)}.pill.done{color:var(--ok);border-color:var(--ok)}.pill.cancelled{color:var(--bad);border-color:var(--bad)}
.tl td.on{background:var(--info-bg);font-weight:600}
.tl td.ledger{background:var(--k-bg);color:var(--k);font-weight:600}
.doc{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;min-width:0}
.doc-h{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.doc-h b{font-size:15px}
.ptr{display:flex;gap:6px;flex-wrap:wrap}
.ptr span{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--soft)}
.ptr span.cur{background:var(--warn-bg);color:var(--warn);font-weight:600}
.ptr span.led{background:var(--k-bg);color:var(--k);font-weight:600}
.doc-t{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);overflow-x:auto}
.doc-t button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;font:inherit;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.doc-t button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.doc-b{padding:12px 14px}
.diff del{background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
.diff ins{background:var(--ok-bg);color:var(--ok);text-decoration:none}
.steps-v{list-style:none;margin:0;padding:0}
.steps-v li{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.steps-v li:last-child{border-bottom:0}
.steps-v .dot{width:20px;height:20px;border-radius:50%;flex:0 0 20px;display:grid;place-items:center;font-size:11px;color:#fff;background:var(--none)}
.steps-v .dot.ok{background:var(--ok)}.steps-v .dot.warn{background:var(--warn)}
/* findings */
.fd{display:flex;gap:10px;padding:8px 10px;border-radius:8px;margin-bottom:6px;font-size:13px;border:1px solid var(--line)}
.fd.block{background:var(--bad-bg);border-color:transparent}.fd.warn{background:var(--warn-bg);border-color:transparent}.fd.info{background:var(--info-bg);border-color:transparent}
.fd .lv{font-weight:700;min-width:58px}
.fd.block .lv{color:var(--bad)}.fd.warn .lv{color:var(--warn)}.fd.info .lv{color:var(--info)}
.fd small{display:block;color:var(--muted)}
.toast{max-width:380px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:10px;padding:10px 12px;box-shadow:0 6px 18px rgba(0,0,0,.12);font-size:13px}
.field{display:grid;gap:4px;max-width:380px}
.field input{font:inherit;padding:6px 9px;border-radius:8px;border:1.5px solid var(--bad);background:var(--panel);color:var(--ink)}
.field .hint{color:var(--bad);font-size:12px}
/* tiền */
.form{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:10px}
.form label{display:grid;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.form input,.form select{font:inherit;padding:6px 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);min-width:0;max-width:100%}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ok-line{color:var(--ok);font-weight:600}.bad-line{color:var(--bad);font-weight:600}
pre{background:var(--soft);border-radius:8px;padding:10px;overflow-x:auto;font:12px/1.5 ui-monospace,Consolas,monospace;margin:6px 0}

:root{--st-good:#0ca30c;--st-warn:#fab219;--st-serious:#ec835a;--st-crit:#d03b3b;--bar-1:#2a78d6;

:root[data-theme="dark"]{--bar-1:#3987e5;--grid:#272b35}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:0 0 14px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.filters label{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.filters select,.filters input{font:inherit;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);max-width:100%}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px;margin-bottom:14px}
.tile-n{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;min-width:0}
.tile-n:hover{border-color:var(--accent)}
.tile-n .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tile-n .l{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.tile-n .s{font-size:11.5px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 9px}
.vbar{display:flex;gap:2px;height:20px;border-radius:4px;overflow:hidden;background:var(--panel)}
.vbar span{display:block;height:100%;min-width:2px}
.vrow{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 64px;gap:10px;align-items:center;padding:6px 0}
.vrow .n{font-size:13px}.vrow .t{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.vlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.vlegend span{display:inline-flex;gap:5px;align-items:center}
.hbar{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr) 40px;gap:10px;align-items:center;padding:4px 0;font-size:13px}
.hbar .b{height:14px;border-radius:0 4px 4px 0;background:var(--bar-1)}
.hbar .t{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:10.5px}
.heat td{text-align:center;font-variant-numeric:tabular-nums;min-width:56px}
.heat td.c{cursor:default}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:62px 22px minmax(0,1fr);gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px;align-items:start}
.tl li:last-child{border-bottom:0}
.tl .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700}
.tl small{color:var(--muted);display:block}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px;box-shadow:0 6px 18px rgba(0,0,0,.18);display:none;max-width:280px}
@media (max-width:760px){main{padding:12px}}
@media (max-width:560px){.vrow{grid-template-columns:minmax(0,1fr) 56px}.vrow .n{grid-column:1/-1}.hbar{grid-template-columns:minmax(0,1fr) 40px}.hbar .lbl{grid-column:1/-1}}
</style>

// ============================================================ thư viện tiền (mã tham chiếu 18 §3 — bản chạy thật)
function roundMoney(amount, unit = 1) {
  const r = Math.floor(Math.abs(amount) / unit + 0.5) * unit;
  return amount < 0 ? -r : r;
}
function allocate(total, weights, opts = {}) {
  const unit = opts.unit ?? 1;
  if (!Number.isSafeInteger(total)) throw new RangeError('total phải là số nguyên đồng');
  if (!Number.isSafeInteger(unit) || unit < 1) throw new RangeError('unit phải là số nguyên ≥ 1');
  if (weights.length === 0) { if (total !== 0) throw new RangeError('không có dòng để chia'); return []; }
  if (weights.some((w) => !Number.isFinite(w) || w < 0)) throw new RangeError('trọng số phải ≥ 0');
  const w = weights.every((x) => x === 0) ? weights.map(() => 1) : weights;
  const W = w.reduce((s, x) => s + x, 0);
  const abs = Math.abs(total), units = Math.floor(abs / unit), tail = abs - units * unit;
  const raw = w.map((x) => (units * x) / W);
  const out = raw.map(Math.floor);
  const base = out.slice();
  const order = w.map((_, i) => i).filter((i) => w[i] > 0).sort((i, j) => (raw[j] - out[j]) - (raw[i] - out[i]) || i - j);
  for (let k = 0, rest = units - out.reduce((s, x) => s + x, 0); rest > 0; k++, rest--) out[order[k % order.length]] += 1;
  const res = out.map((x) => x * unit);
  res[order[0]] += tail;
  return { res: res.map((x) => (total < 0 ? -x : x) + 0), raw, base, out, order, units, tail };
}
function schedule(total, periods, opts = {}) {
  const unit = opts.unit ?? 1;
  if (!Number.isSafeInteger(total) || total < 0) throw new RangeError('total phải là số nguyên đồng ≥ 0');
  if (!Number.isInteger(periods) || periods < 1) throw new RangeError('periods phải ≥ 1');
  const partial = opts.firstDays != null && opts.firstDays < opts.daysInFirstMonth;
  const count = periods + (partial ? 1 : 0);
  const monthly = roundMoney(total / periods, unit);
  const out = [];
  let remaining = total;
  for (let i = 0; i < count && remaining > 0; i++) {
    let amount = i === 0 && partial ? roundMoney((monthly * opts.firstDays) / opts.daysInFirstMonth, unit) : monthly;
    amount = i === count - 1 ? remaining : Math.min(Math.max(amount, 1), remaining);
    out.push(amount); remaining -= amount;
  }
  return out;
}

// ============================================================ tiện ích
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const vnd = (n) => n.toLocaleString('vi-VN');
const LV = {ok:['ok','✅ có'], warn:['warn','🟡 một phần'], bad:['bad','☐ chưa'], k:['k','K cần Kernel']};
const tag = (s) => `<span class="tag ${LV[s][0]}">${LV[s][1]}</span>`;

// ============================================================ vẽ bản đồ luồng (SVG từ dữ liệu)
function flowSvg(f) {
  const CW = 194, LH = 92, LW = 92, NW = 148, NH = 60;
  const cols = Math.max(...f.nodes.map((n) => n.col)) + 1;
  const W = LW + cols * CW + 8, H = f.lanes.length * LH;
  const at = {}; f.nodes.forEach((n) => { at[n.id] = { ...n, x: LW + n.col * CW + (CW - NW) / 2, y: n.lane * LH + (LH - NH) / 2 }; });
  const lines = (txt, x, y, cls, dy = 13) => txt.split('|').map((t, i) => `<text class="${cls}" x="${x}" y="${y + i * dy}" text-anchor="middle">${esc(t)}</text>`).join('');
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(f.title)}">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="ahl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah link" d="M0,0 L10,5 L0,10 z"/></marker></defs>`;
  f.lanes.forEach((l, i) => {
    s += `<rect class="lane-bg ${i % 2 ? 'alt' : ''}" x="0" y="${i * LH}" width="${W}" height="${LH}"/>`;
    const parts = l.split('|');
    s += parts.map((p, k) => `<text class="lane-t" x="10" y="${i * LH + LH / 2 - (parts.length - 1) * 7 + k * 14 + 4}">${esc(p)}</text>`).join('');
  });
  // cạnh trước, nút sau để nút nằm trên
  f.edges.forEach(([a, b, label, kind]) => {
    const A = at[a], B = at[b]; if (!A || !B) return;
    let d, lx, ly;
    if (A.col === B.col) {
      const down = B.lane > A.lane;
      const x = A.x + NW / 2, y1 = down ? A.y + NH : A.y, y2 = down ? B.y : B.y + NH;
      d = `M${x},${y1} V${y2}`; lx = x + 4; ly = (y1 + y2) / 2;
    } else {
      const fwd = B.col > A.col;
      const x1 = fwd ? A.x + NW : A.x, y1 = A.y + NH / 2, x2 = fwd ? B.x : B.x + NW, y2 = B.y + NH / 2;
      const mx = fwd ? x2 - (CW - NW) / 2 : x1 - (CW - NW) / 2;
      d = A.lane === B.lane ? `M${x1},${y1} H${x2}` : `M${x1},${y1} H${mx} V${y2} H${x2}`;
      lx = A.lane === B.lane ? (x1 + x2) / 2 : mx + 4; ly = A.lane === B.lane ? y1 - 5 : (y1 + y2) / 2;
    }
    s += `<path class="e ${kind || ''}" d="${d}" marker-end="url(#${kind === 'link' ? 'ahl' : 'ah'})"/>`;
    if (label) { const tw = label.length * 5.6 + 6; s += `<rect class="elbg" x="${lx - 2}" y="${ly - 9}" width="${tw}" height="13" rx="3"/><text class="el" x="${lx + 1}" y="${ly + 1}">${esc(label)}</text>`; }
  });
  f.nodes.forEach((n) => {
    const { x, y } = at[n.id], cx = x + NW / 2;
    const tl = n.t.split('|').length, sl = (n.s || '').split('|').length;
    const top = y + NH / 2 - ((tl + sl) * 12.5) / 2 + 10;
    if (n.kind === 'gate') {
      s += `<polygon class="gate" points="${cx},${y - 4} ${x + NW + 4},${y + NH / 2} ${cx},${y + NH + 4} ${x - 4},${y + NH / 2}"/>`;
    } else if (n.kind === 'post') {
      s += `<rect class="post" x="${x}" y="${y}" width="${NW}" height="${NH}" rx="6"/><text class="tk" x="${x + 6}" y="${y + 12}">◆ ghi sổ</text>`;
    } else if (n.kind === 'calc') {
      s += `<rect class="calc" x="${x}" y="${y}" width="${NW}" height="${NH}" rx="8"/>`;
    } else {
      s += `<rect class="nd g-${n.g}" x="${x}" y="${y}" width="${NW}" height="${NH}" rx="8"/><rect class="bar g-${n.g}" x="${x}" y="${y + 6}" width="4" height="${NH - 12}" rx="2"/>`;
    }
    const off = n.kind === 'post' ? 5 : 0;
    s += lines(n.t, cx, top + off, 't1', 13) + lines(n.s || '', cx, top + off + tl * 13, n.kind === 'post' ? 'tk' : 't2', 12);
  });
  return s + '</svg>';
}

   <div class="card"><h4>Chứng từ cần xem lại</h4><div class="tbl" style="margin:0"><table><thead><tr><th>Chứng từ</th><th>Mã</th><th>Mức</th><th>Người lập</th><th>Tuổi</th></tr></thead><tbody>
    ${REVIEW.map(([r, n, c, l, u, a]) => `<tr><td>${esc(n)}<br><code style="color:var(--muted)">${r}</code></td><td><code>${c}</code></td><td>${esc(l)}</td><td><code>${u}</code></td><td>${a}</td></tr>`).join('')}</tbody></table></div></div>
  </div>
  <h3>④ Sai vai trò</h3>
  <div class="grid wide">
   <div class="card"><h4>Bị từ chối theo lý do (cổng phân quyền)</h4>
    ${ROLE.map(([t, v]) => `<div class="hbar" data-tip="${esc(t)}: ${v} lần"><div class="lbl">${esc(t)}</div><div><div class="b" style="width:${(v / ROLE[0][1]) * 100}%"></div></div><div class="t">${v}</div></div>`).join('')}
    <p style="margin-top:8px">Quyết định đến từ <code>authorize()</code> PHASE-028; mỗi dòng có <code>decisionId</code> và <code>explain</code>.</p></div>
   <div class="card"><h4>Gần nhất</h4><div class="tbl" style="margin:0"><table><thead><tr><th>Lúc</th><th>Người</th><th>Việc</th><th>Lý do</th></tr></thead><tbody>
    ${ROLE_ROWS.map(([t, u, a, d, c, w]) => `<tr><td>${t}</td><td><code>${u}</code></td><td><code>${a}</code><br><small style="color:var(--muted)">${esc(d)}</small></td><td><code>${c}</code><br><small style="color:var(--muted)">${esc(w)}</small></td></tr>`).join('')}</tbody></table></div></div>
  </div>
  <h3>⑤ Luồng chuyển trạng thái — đề nghị thanh toán</h3>
  <div class="grid wide">
   <div class="card"><h4>Số lần chuyển (nguồn → đích)</h4><div class="tbl heat" style="margin:0"><table><thead><tr><th>từ \\ sang</th>${TTO.map((t) => `<th class="num">${esc(t)}</th>`).join('')}</tr></thead><tbody>
    ${TMAT.map((r, i) => `<tr><td><code>${TFROM[i]}</code></td>${r.map((v, j) => { const s = seq(v, maxM); return `<td class="c" style="${s ? `background:var(--seq-${s});color:${s >= 4 ? '#fff' : '#0b0b0b'}` : 'color:var(--muted)'}" data-tip="${TFROM[i]} → ${esc(TTO[j])}: ${v} lần">${v || '·'}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div>
    <p style="margin-top:6px">Đậm hơn = nhiều hơn. 23 lần từ chối ở bước 1, 7 ở bước 2.</p></div>
   <div class="card"><h4>Thời gian ở mỗi trạng thái (trung vị)</h4><div class="tbl" style="margin:0"><table><tbody>${DWELL.map(([s, d]) => `<tr><td><code>${s}</code></td><td class="num"${/nghẽn/.test(d) ? ' style="color:var(--bad);font-weight:600"' : ''}>${d}</td></tr>`).join('')}</tbody></table></div>
    <p style="margin-top:6px">Cấp 2 (<code>approved1 → approved</code>) đang nghẽn: gợi ý xem lại chính sách <code>quy.de_nghi_tt.duyet</code> hoặc thêm người duyệt cấp 2.</p></div>
  </div>
  <h3>⑥ Sổ cổng = bằng chứng — nhật ký hành vi (ai · khi nào · từ đâu · làm gì · chống sửa · căn cứ)</h3>
  <div class="card"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px">
    <span class="tag ok">✓ chuỗi băm khớp · 06/11 (chain_seq 18 204 → 18 391)</span><span class="tag warn">Tệp niêm phong: chờ Q030-5</span>
    <span class="spacer"></span><label style="font-size:12px;color:var(--muted)">Kết quả <select id="jv" style="font:inherit;padding:3px 6px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink)"><option value="">tất cả</option>${VERD.map((v) => `<option value="${v[0]}">${v[1]}</option>`).join('')}</select></label></div>
   <ul class="tl" id="jl"></ul>
   <p style="margin-top:6px">Mỗi dòng là một bằng chứng (<code>audit_logs</code>) với <code>gates[]</code>: định danh người (không tên), cổng, việc, chứng từ + phiên bản, mã, băm dòng; mở ra thấy <i>từ đâu</i> (phiên, IP rút gọn, trình duyệt) và <i>căn cứ</i> (văn bản, tham số + giá trị tại ngày). Không nội dung chứng từ (R-SEC-10). Bấm một chứng từ → tab <b>Cổng</b> của chứng từ đó.</p></div>`;
}
function drawTrend() {
  const el = $('#trend'); if (!el) return;
  const W = 520, H = 200, L = 30, R = 64, T = 10, B = 26, n = DAYS.length;
  const max = Math.ceil(Math.max(...TREND.block, ...TREND.hold) / 4) * 4;
  const x = (i) => L + (i * (W - L - R)) / (n - 1), y = (v) => T + (1 - v / max) * (H - T - B);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Số lần chặn và giữ theo ngày">`;
  for (let k = 0; k <= 4; k++) { const v = (max / 4) * k; s += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`; }
  DAYS.forEach((d, i) => { if ((i % 3 === 0 && n - 1 - i >= 2) || i === n - 1) s += `<text class="ax" x="${x(i)}" y="${H - 8}" text-anchor="middle">${d}</text>`; });
  [['block', 'var(--st-crit)', 'Chặn'], ['hold', 'var(--st-serious)', 'Giữ']].forEach(([k, c, lbl]) => {
    const a = TREND[k];
    s += `<polyline fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" points="${a.map((v, i) => `${x(i)},${y(v)}`).join(' ')}"/>`;
    s += `<circle cx="${x(n - 1)}" cy="${y(a[n - 1])}" r="4" fill="${c}" stroke="var(--panel)" stroke-width="2"/><text x="${x(n - 1) + 8}" y="${y(a[n - 1]) + 4}" style="fill:var(--ink);font-size:11px">${lbl} ${a[n - 1]}</text>`;
  });
  s += `<line id="xh" class="gl" x1="0" x2="0" y1="${T}" y2="${H - B}" style="stroke:var(--muted);display:none"/><rect id="hit" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/></svg>`;
  el.innerHTML = s;
  const svg = el.querySelector('svg'), hit = el.querySelector('#hit'), xh = el.querySelector('#xh'), tip = $('#tip');
  hit.addEventListener('mousemove', (e) => {
    const r = svg.getBoundingClientRect(), px = ((e.clientX - r.left) / r.width) * W;
    const i = Math.max(0, Math.min(n - 1, Math.round(((px - L) / (W - L - R)) * (n - 1))));
    xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.style.display = '';
    tip.innerHTML = `<b>${DAYS[i]}</b><br>✕ Chặn: ${TREND.block[i]}<br>⏸ Giữ: ${TREND.hold[i]}`; tip.style.display = 'block';
    tip.style.left = Math.min(e.clientX + 14, innerWidth - 200) + 'px'; tip.style.top = e.clientY + 14 + 'px';
  });
  hit.addEventListener('mouseleave', () => { xh.style.display = 'none'; tip.style.display = 'none'; });
}
function drawJournal() {
  const el = $('#jl'); if (!el) return;
  const f = $('#jv').value;
  el.innerHTML = JOURNAL.filter((j) => !f || j[1] === f).map(([t, v, u, g, a, d, c, h]) => { const V = vcol(v); return `<li><span style="font-variant-numeric:tabular-nums;color:var(--muted)">${t}</span><span class="ic" style="background:${V[3]}" title="${V[1]}">${V[2]}</span>
    <div><b>${esc(V[1])}</b> · <code>${esc(g)}</code> · <code>${esc(u)}</code> — <code>${esc(a)}</code><small>${esc(d)} · mã ${esc(c)} · băm ${esc(h)}</small></div></li>`; }).join('') || '<li><span></span><span></span><div>Không có dòng nào.</div></li>';
}
function mountGates() {
  if (!$('#trend')) return;
  drawTrend(); drawJournal(); $('#jv').onchange = drawJournal;
}
// chú thích khi rê chuột cho mọi phần tử có data-tip
document.addEventListener('mousemove', (e) => {
  const t = e.target.closest && e.target.closest('[data-tip]'), tip = $('#tip');
  if (!t) { if (!e.target.closest('#trend')) tip.style.display = 'none'; return; }
  tip.textContent = t.dataset.tip; tip.style.display = 'block';
  tip.style.left = Math.min(e.clientX + 14, innerWidth - 290) + 'px'; tip.style.top = e.clientY + 14 + 'px';
});

// ============================================================ điều hướng
const RENDER = { 'tong-quan': pageOverview, 'ban-hang': () => pageFlow('ban-hang'), kho: () => pageFlow('kho'), luong: () => pageFlow('luong'), 'ke-toan': () => pageFlow('ke-toan'), 'chung-tu': pageDocStd, cong: pageGates, tien: pageMoney, 'thong-bao': pageFindings, 'danh-muc': pageCatalog };
const OLD = { mh: 'danh-muc', bh: 'ban-hang', ts: 'danh-muc', kt: 'ke-toan', ns: 'luong' };
const tabsEl = $('#tabs'), mainEl = $('#main');
tabsEl.innerHTML = PAGES.map(([id, t]) => `<button role="tab" id="tab-${id}" data-p="${id}">${t}</button>`).join('');
tabsEl.querySelectorAll('button').forEach((b) => (b.onclick = () => (location.hash = b.dataset.p)));
function show() {
  let id = (location.hash || '#tong-quan').slice(1);
  if (OLD[id]) id = OLD[id];
  if (!RENDER[id]) id = 'tong-quan';
  tabsEl.querySelectorAll('button').forEach((b) => b.setAttribute('aria-selected', b.dataset.p === id));
  mainEl.innerHTML = RENDER[id]();
  mountDocTabs(); mountMoney(); mountCatalog(); mountGates();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', show);
show();
$('#theme').onclick = () => { const r = document.documentElement; const cur = r.getAttribute('data-theme'); const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.setAttribute('data-theme', dark ? 'light' : 'dark'); };
</script>
