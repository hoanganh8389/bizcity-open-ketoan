function runCheck() {
  const code = $('#vc').value.trim(); const val = $('#vv').value.trim(); const at = $('#va').value; const ov = $('#vo').checked;
  const it = ITEMS.find((i) => i.code === code) ?? ITEMS.find((i) => i.code.toLowerCase() === code.toLowerCase());
  const out = []; let resolved = '';
  if (!it) out.push({ code:'LIB-UNKNOWN-001', level:'block', msg:`"${code}" không có trong vn.tham-so-phap-ly`, s:[['LUONG_CO_SO','Lương cơ sở','gần nhất theo mã / tên']] });
  else {
    if (it.code !== code) resolved = it.code;
    const e = valueAt(it, at);
    if (!e) out.push({ code:'LIB-EFFECTIVE-001', level:'block', msg:`${it.code} không có giá trị tại ${at}`, s:[[it.eff[0][2], fmt(it.eff[0][2]) + ` (${it.eff[0][0]} →)`, it.eff[0][3] + ' (chưa duyệt)']] });
    else if (val !== '' && Number(val) !== e[2]) out.push({ code:'LIB-VALUE-001', level:'warn', msg:`giá trị khác thư viện tại ngày ${at}`, s:[[e[2], fmt(e[2]) + ` (${e[0]} → ${e[1] ?? 'nay'})`, e[3] + ' (chưa duyệt)']] });
    if (ov && it.kind === 'law') out.push({ code:'TSPL-LAW-001', level:'warn', msg:'Ghi đè tham số theo luật', s:[] });
    if (!it.attested) out.push({ code:'LIB-UNVERIFIED-001', level:'info', msg:`${it.code} chưa được kế toán trưởng duyệt`, s:[] });
  }
  const ok = !out.some((f) => f.level === 'block');
  $('#vres').innerHTML = `<div class="result"><b>${ok ? '<span class="tag ok">ok: true</span>' : '<span class="tag bad">ok: false</span>'}</b> <span class="muted">vn.tham-so-phap-ly@1.0.0 · tại ${at}${resolved ? ` · resolved → <span class="k">${resolved}</span>` : ''}</span>
  ${out.length ? out.map((f) => `<div class="finding ${f.level}"><span class="k">${f.code}</span> <span class="tag ${LEVEL[f.level][0]}">${LEVEL[f.level][1]}</span> ${esc(f.msg)}<div>${f.s.map(([v, l, w]) => `<button class="sugg" data-v="${esc(v)}">↳ ${esc(l)} <small class="muted">${esc(w)}</small></button>`).join('')}</div></div>`).join('') : '<div class="finding">không có phát hiện</div>'}</div>`;
}

  <tr><td class="k">library.vn.tham-so-phap-ly.GIO_LAM_VIEC_NGAY</td><td class="num">8</td><td class="num"><b>7,5</b></td><td>2026-01-01</td><td>Nội quy công ty 2026</td><td><span class="tag ok">chính sách — được ghi đè</span></td></tr>
  <tr><td class="k">library.vn.tham-so-phap-ly.LUONG_CO_SO</td><td class="num">2.530.000</td><td class="num"><b>2.340.000</b></td><td>2026-07-01</td><td>chờ văn bản</td><td><span class="tag bad">TSPL-LAW-001 · ghi đè tham số luật</span></td></tr>
  </tbody></table></div></div>
  <p class="muted">Ghi đè nằm trong <code>setting_values</code> (đường có sẵn của HT13: phiên bản, hiệu lực, căn cứ, chặn kỳ đã khoá). Khi thư viện ra bản trùng giá trị đơn vị đang ghi đè → nhắc "có thể bỏ ghi đè".</p>`;
}

function deXuat() {
  const ST = { gui:['info','đã gửi'], nhan:['warn','Nhóm Lõi đã nhận'], 'da-vao':['ok','đã vào bản'] };
  return `<h2>Đề xuất cập nhật thư viện</h2><p class="lead">Đơn vị không sửa thư viện gốc — gửi đề xuất kèm căn cứ; Nhóm Lõi đưa vào bản mới qua PR (SC-LIB-1). Cần giá trị ngay thì ghi đè ở tab Cấu hình.</p>
  <div class="panel"><div class="tbl"><table><thead><tr><th>Số</th><th>Thư viện</th><th>Loại</th><th>Nội dung</th><th>Căn cứ</th><th>Người gửi</th><th>Trạng thái</th></tr></thead><tbody>
  ${REQUESTS.map((r) => `<tr><td class="k">${r.id}</td><td class="k">${r.lib}</td><td>${r.type}</td><td>${esc(r.what)}</td><td>${esc(r.basis)}</td><td>${esc(r.by)}</td><td><span class="tag ${ST[r.state][0]}">${ST[r.state][1]}${r.ver ? ' ' + r.ver : ''}</span></td></tr>`).join('')}
  </tbody></table></div></div>
  <h3>Lập đề xuất</h3>
  <div class="panel pad"><div class="form"><label>Thư viện</label><select>${LIBS.filter((l) => !l.planned).map((l) => `<option>${l.id}</option>`).join('')}</select>
  <label>Loại</label><select><option>thêm mục</option><option>sửa giá trị (khoảng hiệu lực mới)</option><option>thêm / sửa căn cứ</option><option>báo sai</option><option>ngừng dùng mục (kèm mã thay thế)</option></select>
  <label>Nội dung</label><textarea rows="3" placeholder="vd: thêm 2026-09-01 và 2026-09-02 — nghỉ Quốc khánh"></textarea>
  <label>Căn cứ</label><select><option>chọn văn bản trong vn.can-cu-phap-ly…</option></select><label>Tệp</label><input type="file"><label></label><div><button class="btn pri">Gửi</button> <button class="btn">Xuất JSON cho Nhóm Lõi</button></div></div>
  <p class="muted">Lưu <code>library_change_requests</code>; không chứa dữ liệu khách / số tiền chứng từ (R-SEC-10).</p></div>`;
}

function boKiem() {
  const P = [
    ['Ô chọn','<code>LibraryPicker</code> (ui-kit)','lúc gõ / chọn','không chặn — chỉ mục còn dùng, nhãn chưa duyệt, giá trị tại ngày','A2'],
    ['API kiểm','<code>POST /api/v1/libraries/:id/validate</code>','form trước khi lưu · app ngoài · AI (MCP)','trả ok; bên gọi quyết','có'],
    ['Trong action','<code>ctx.libraries.validate(id, v, { at })</code>','trong giao dịch, trước khi ghi','block → lỗi kèm LIB-*; warn → cần lý do (cổng validation)','B5'],
    ['Cửa nạp (Gate B)','bảng trường ↔ thư viện theo loại chứng từ','L3 / L4, mọi kênh','mặc định cảnh báo; chặn khi mã lạ ở trường bắt buộc','B5 · K1/K2'],
    ['Bộ kiểm tĩnh','SC-LIB-1 · SC-LIB-2','mỗi PR, CI','chặn PR: thư viện sai khuôn; trường khai sai; mã cứng trùng thư viện','SC-LIB-1 có'],
    ['Skill / CLI','<code>npx bizcity library check</code>','khi dev / AI viết module','PASS / WARN / FAIL như event check','B4'],
  ];
  return `<h2>Bộ kiểm dùng thư viện thế nào</h2><p class="lead">Một bộ kiểm (<code>validateAgainstLibrary</code>, Platform), sáu chỗ gọi, cùng một khuôn kết quả: <code>{ ok, library@bản#băm, at, resolved?, value?, findings[{ code, level, path, suggestions[] }] }</code>.</p>
  <div class="flow">${P.map(([t, w, when, lv, st], i) => `<div class="step"><div><span class="n">${i + 1}</span><b>${t}</b> <span class="tag ${st === 'có' || st.startsWith('SC-LIB-1') ? 'ok' : 'none'}">${st}</span></div><div style="margin:6px 0">${w}</div><div class="muted" style="font-size:12.5px">Khi: ${when}<br>Mức: ${lv}</div></div>`).join('')}</div>
  <h3>Một lượt kiểm đi qua những gì</h3>
  <div class="flow">
    <div class="step"><b>1 · Tìm mục</b><div class="muted" style="font-size:12.5px">mã · bí danh · không phân biệt hoa thường → <span class="k">resolved</span>; không thấy → LIB-UNKNOWN-001 + 5 mục gần nhất</div></div>
    <div class="step"><b>2 · Trạng thái</b><div class="muted" style="font-size:12.5px">deprecated → LIB-DEPRECATED-001 gợi ý replacedBy · removed → LIB-REMOVED-001</div></div>
    <div class="step"><b>3 · Hiệu lực tại ngày</b><div class="muted" style="font-size:12.5px">ngày chứng từ (hoặc hôm nay theo cấu hình) → giá trị · ngoài khoảng → LIB-EFFECTIVE-001</div></div>
    <div class="step"><b>4 · Giá trị & khuôn</b><div class="muted" style="font-size:12.5px">ghi đè đơn vị (nếu có) → so giá trị → LIB-VALUE-001 · sai khuôn → LIB-SCHEMA-001</div></div>
    <div class="step"><b>5 · Luật riêng</b><div class="muted" style="font-size:12.5px">rules[] khai báo (all / any / not, 11 phép) · mức sau khi đơn vị hạ · gợi ý từ thư viện khác</div></div>
    <div class="step"><b>6 · Dấu vết</b><div class="muted" style="font-size:12.5px">bằng chứng basis_used (thư viện@bản#băm, mã, ngày, giá trị) · một dòng đếm library_usage_daily (sau commit)</div></div>
  </div>
  <h3>Khai trong manifest (đề xuất bizcity_module@1 1.3.0)</h3>
<pre>"libraries": [
  { "id": "vn.tham-so-phap-ly", "fields": ["payroll.insuranceRate", "payroll.baseSalary"], "at": "docDate", "required": true },
  { "id": "core.khoan-muc",     "fields": ["voucher.lines[].costItem"], "required": true }
]</pre>
  <p class="muted">Không có trong bảng này: luật cần tính toán (cộng dồn, so nhiều chứng từ) → Rule Contract của Policy Registry (ADR-0031). Thư viện không sinh bút toán, không cấp quyền (D-LIB-8).</p>`;
}

function dev() {
  return `<h2>Dev & skill — luôn theo chuẩn thư viện</h2><p class="lead">Skill <code>skills/use-bizcity-library/SKILL.md</code> (cài sang dự án khác bằng <code>npx bizcity skills install</code>) dạy dev / trợ lý AI bốn việc; chỉ báo "xong" khi lệnh ra PASS và <code>selfcheck --only SC-LIB</code> ĐẠT.</p>
  <div class="grid2">
  <div class="panel pad"><h3 style="margin-top:0">1 · Tìm thư viện cho một ô</h3><pre>$ npx bizcity library search "ty le bhxh"
vn.tham-so-phap-ly  BHXH_NLD   Tỷ lệ BHXH người lao động đóng  8 %  (chưa duyệt)
vn.tham-so-phap-ly  BHXH_DN_*  …3 mục
→ gắn: "libraries": [{ "id": "vn.tham-so-phap-ly", "fields": ["…"] }]</pre><p class="muted">Không tự đặt danh sách cứng khi thư viện đã có.</p></div>
  <div class="panel pad"><h3 style="margin-top:0">2 · Kiểm giá trị</h3><pre>$ npx bizcity library check vn.tham-so-phap-ly LUONG_CO_SO \\
    --value 2340000 --at 2026-08-01
⚠ LIB-VALUE-001  giá trị khác thư viện tại ngày 2026-08-01
   ↳ gợi ý 2.530.000 (2026-07-01 → nay) — Nghị định 161/2026/NĐ-CP (chưa duyệt)
ℹ LIB-UNVERIFIED-001
KẾT LUẬN: WARN</pre><p class="muted">Nghĩa mã: <code>npx bizcity explain LIB-VALUE-001</code> — không đoán.</p></div>
  <div class="panel pad"><h3 style="margin-top:0">3 · Thêm thư viện</h3><pre>$ npx bizcity library new core.khoan-muc --kind code-list
libraries/core.khoan-muc/library.json   khung + itemSchema + selector
libraries/core.khoan-muc/README.md      hướng dẫn (bắt buộc)
libraries/core.khoan-muc/build.mjs      sinh từ sources/
$ node libraries/core.khoan-muc/build.mjs &amp;&amp; npx bizcity library check core.khoan-muc --all</pre></div>
  <div class="panel pad"><h3 style="margin-top:0">4 · Cập nhật / thêm căn cứ</h3><pre>$ node libraries/vn.tham-so-phap-ly/build.mjs
$ npx bizcity library diff vn.tham-so-phap-ly
  ~ TNCN_GIAM_TRU_NPT  + khoảng 2026-01-01 → nay = 6.200.000
  basis.key → NQ-110-2025 (vn.can-cu-phap-ly)
  bản sẽ lên: 1.0.0 → 1.1.0 (minor: thêm khoảng hiệu lực)
$ node tests/conformance/selfcheck.mjs --only SC-LIB</pre><p class="muted">Không sửa tay library.json; không xoá mục (deprecated → removed).</p></div>
  </div>
  <h3>Trợ lý AI (MCP, chỉ đọc)</h3>
  <div class="panel pad"><code>core.library.list</code> · <code>core.library.get</code> · <code>core.library.items</code> · <code>core.library.validate</code> · <code>core.findings.explain</code> — AI tra đúng nguồn, không bịa mã, không tự đặt thuế suất / tham số.</div>`;
}

function render() {
  nav();
  const R = { 'tong-quan': tongQuan, 'danh-sach': danhSach, 'chi-tiet': chiTiet, 'can-cu': canCu, 'cau-hinh': cauHinh, 'de-xuat': deXuat, 'bo-kiem': boKiem, dev };
  $('#main').innerHTML = (R[tab] ?? tongQuan)();
  if (tab === 'chi-tiet' && sub === 'kiem') { $('#vrun').onclick = runCheck; runCheck(); }
  if (tab === 'chi-tiet' && sub === 'muc') {
    const draw = () => {
      const q = $('#pq').value.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').toLowerCase().trim();
      const at = '2026-11-08';
      const rows = ITEMS.filter((i) => !q || (i.code + ' ' + i.name).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').toLowerCase().includes(q));
      $('#pl').innerHTML = rows.map((i) => { const e = valueAt(i, at); return `<li><span>${esc(i.name)} <small class="k">${i.code}</small></span><small>${e ? fmt(e[2]) : '—'} · chưa duyệt</small></li>`; }).join('') || '<li class="muted">không có — LIB-UNKNOWN-001 sẽ gợi ý mục gần nhất</li>';
    };
    $('#pq').oninput = draw; draw();
  }
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.go) { tab = b.dataset.go; location.hash = tab; render(); return; }
  if (b.dataset.lib) { libSel = b.dataset.lib; tab = 'chi-tiet'; sub = b.dataset.sub || (b.closest('#subs') ? sub : 'muc'); location.hash = tab; render(); return; }
  if (b.classList.contains('sugg') && $('#vv')) { $('#vv').value = b.dataset.v; runCheck(); }
});
$('#theme').onclick = () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark'; };
window.addEventListener('hashchange', () => { tab = location.hash.slice(1) || 'tong-quan'; render(); });
render();
</script>
