server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 25m;

  # API và tài liệu API → container api
  location /api/ {
    proxy_pass http://api:4100;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  # Tệp tĩnh có mã băm: lưu đệm lâu
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Ứng dụng một trang: mọi đường dẫn khác trả index.html.
  # index.html KHÔNG lưu đệm (luôn hỏi lại máy chủ): bản mới triển khai là trình duyệt (kể cả khung nhúng trong trang
  # quản trị) nạp ngay, không kẹt bản cũ. Tệp /assets/ có mã băm nên vẫn lưu đệm lâu.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache, must-revalidate";
  }
}
