server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 25m;

  # Header bảo mật (R-SEC-11). LƯU Ý nginx: location nào có add_header riêng thì KHÔNG thừa hưởng add_header của server
  # → lặp lại cùng bốn dòng trong từng location có add_header bên dưới.
  # Không đặt X-Frame-Options / frame-ancestors: phần mềm được nhúng trong khung trang quản trị WordPress.
  # HSTS đặt ở proxy TLS phía trước (cổng 443), không đặt ở đây (cổng 80 nội bộ) — xem docs/ops/DEPLOY.md.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "object-src 'none'; base-uri 'self'" always;

  # API và tài liệu API → container api
  location /api/ {
    proxy_pass http://api:4100;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  # Tệp tĩnh có mã băm: lưu đệm lâu
  # MCP cho trợ lý AI (bizcity_mcp@1): POST /mcp → container api. Thời hạn ngắn theo bridge §3 (ghi ≤ 8 giây, có dư).
  location = /mcp {
    proxy_pass http://api:4100;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "object-src 'none'; base-uri 'self'" always;
  }

  # Ứng dụng một trang: mọi đường dẫn khác trả index.html.
  # index.html KHÔNG lưu đệm (luôn hỏi lại máy chủ): bản mới triển khai là trình duyệt (kể cả khung nhúng trong trang
  # quản trị) nạp ngay, không kẹt bản cũ. Tệp /assets/ có mã băm nên vẫn lưu đệm lâu.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "object-src 'none'; base-uri 'self'" always;
  }
}
